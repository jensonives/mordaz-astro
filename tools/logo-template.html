<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>MORDAZ logo</title>
<style>
  @font-face{
    font-family:'Archivo'; font-style:normal; font-weight:400 900;
    font-stretch:62% 125%; font-display:block;
    src:url('../public/assets/fonts/archivo-latin.woff2') format('woff2');
  }
  @font-face{
    font-family:'Newsreader'; font-style:italic; font-weight:400 500;
    font-display:block;
    src:url('../public/assets/fonts/newsreader-it-latin.woff2') format('woff2');
  }

  :root{ --cream:#F0E9DE; --red:#C4202A; --ink:#171516; }
  *{ box-sizing:border-box; margin:0; }
  html,body{ overflow:hidden; }

  /* The designs below are drawn at a fixed base size and then scaled to
     whatever the caller asked for. Scaling the whole thing keeps every
     proportion — the strike band, the letter-spacing, the rule weight —
     identical at 32px and at 1000px, which re-tuning each size by hand
     does not. */
  .stagewrap{ position:relative; overflow:hidden; }
  .card{
    position:relative;
    display:flex; align-items:center; justify-content:center;
    font-family:'Archivo','Helvetica Neue',Arial,sans-serif;
    overflow:hidden;
    transform-origin:0 0;
  }
  .card.sq{ width:1000px; height:1000px; }
  .card.bn{ width:1500px; height:500px; }

  .glyph{ line-height:1; letter-spacing:-.02em; display:block; }

  /* ── 1 · BLOCK ─────────────────────────────────────────────── */
  .v-block{ background:var(--red); }
  .v-block .glyph{
    color:var(--cream); font-variation-settings:'wdth' 125,'wght' 900;
    font-size:660px; margin-top:-24px;
  }

  /* ── 2 · STRIKE ────────────────────────────────────────────── */
  .v-strike{ background:var(--ink); }
  .v-strike .stack{ position:relative; width:1000px; height:1000px; }
  .v-strike .layer{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  }
  .v-strike .glyph{
    color:var(--cream); font-variation-settings:'wdth' 125,'wght' 900;
    font-size:640px; margin-top:-20px;
  }
  .v-strike .band{
    position:absolute; left:0; right:0; top:432px; height:150px; background:var(--red);
  }
  .v-strike .cut{ clip-path:inset(432px 0 418px 0); }
  .v-strike .cut .glyph{ color:var(--ink); }

  /* ── 3 · PAIR ──────────────────────────────────────────────────
     First letter and last — the Z is the black note, as on the masthead. */
  .v-pair{ background:var(--red); }
  .v-pair .glyph{
    font-variation-settings:'wdth' 74,'wght' 900; font-size:600px;
    margin-top:-20px; letter-spacing:-.05em;
  }
  .v-pair .m{ color:var(--cream); }
  .v-pair .z{ color:var(--ink); }

  /* ── 4 · STACK ─────────────────────────────────────────────── */
  .v-stack{ background:var(--ink); flex-direction:column; gap:0; }
  .v-stack .glyph{
    color:var(--cream); font-variation-settings:'wdth' 68,'wght' 800;
    font-size:300px; letter-spacing:.01em;
  }
  .v-stack .rule{ width:520px; height:16px; background:var(--red); margin:26px 0; }

  /* ── 5 · SERIF ─────────────────────────────────────────────── */
  .v-serif{ background:var(--cream); }
  .v-serif .stack{ position:relative; width:1000px; height:1000px; }
  .v-serif .layer{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  }
  .v-serif .glyph{
    font-family:'Newsreader',Georgia,serif; font-style:italic; font-weight:500;
    color:var(--red); font-size:700px; margin-top:-30px;
  }
  .v-serif .band{
    position:absolute; left:0; right:0; top:452px; height:112px; background:var(--ink);
  }
  .v-serif .cut{ clip-path:inset(452px 0 436px 0); }
  .v-serif .cut .glyph{ color:var(--cream); }

  /* ── BANNER ────────────────────────────────────────────────────
     1500×500, for an X header. The type sits dead centre rather than
     left: X laps the circular avatar over the bottom-left corner and
     crops the sides hard on narrow screens, so the middle is the only
     region guaranteed to survive on every device. */
  .v-banner{ background:var(--red); flex-direction:column; gap:34px; }
  .v-banner .word{
    font-variation-settings:'wdth' 125,'wght' 900;
    font-size:165px; line-height:1; letter-spacing:-.015em;
  }
  .v-banner .word .m{ color:var(--cream); }
  .v-banner .word .z{ color:var(--ink); }
  .v-banner .gloss{
    color:var(--cream); opacity:.82;
    font-variation-settings:'wdth' 92,'wght' 700;
    font-size:30px; letter-spacing:.34em; text-transform:uppercase;
  }
</style>
</head>
<body>
<div class="stagewrap" id="stage"><div class="card" id="card"></div></div>

<script>
  /* Two payload shapes, because tools/New-Logo.ps1 still calls the old one:
       #pair                         -> that variant at its base size
       #{"v":"pair","w":180,"h":180} -> that variant scaled to fit w×h     */
  var hash = decodeURIComponent(location.hash.slice(1)) || 'block';
  var d;
  try { d = hash.charAt(0) === '{' ? JSON.parse(hash) : { v: hash }; }
  catch (e) { d = { v: 'block' }; }

  var v = d.v || 'block';
  var banner = v === 'banner';
  var baseW = banner ? 1500 : 1000;
  var baseH = banner ? 500 : 1000;
  var W = d.w || baseW;
  var H = d.h || baseH;

  var card = document.getElementById('card');
  card.className = 'card ' + (banner ? 'bn' : 'sq') + ' v-' + v;

  var html = {
    block:  '<span class="glyph">M</span>',
    strike: '<div class="stack">' +
              '<div class="layer"><span class="glyph">M</span></div>' +
              '<div class="band"></div>' +
              '<div class="layer cut"><span class="glyph">M</span></div>' +
            '</div>',
    pair:   '<span class="glyph"><span class="m">M</span><span class="z">Z</span></span>',
    stack:  '<span class="glyph">MOR</span><span class="rule"></span><span class="glyph">DAZ</span>',
    serif:  '<div class="stack">' +
              '<div class="layer"><span class="glyph">M</span></div>' +
              '<div class="band"></div>' +
              '<div class="layer cut"><span class="glyph">M</span></div>' +
            '</div>',
    banner: '<span class="word"><span class="m">MORDA</span><span class="z">Z</span></span>' +
            '<span class="gloss">biting &middot; scathing</span>'
  };
  card.innerHTML = html[v] || html.block;

  /* Scale to the requested canvas and size the page to match exactly, so the
     screenshot has no letterboxing and no scrollbars. */
  var scale = Math.min(W / baseW, H / baseH);
  card.style.transform = 'scale(' + scale + ')';

  var stage = document.getElementById('stage');
  stage.style.width = W + 'px';
  stage.style.height = H + 'px';
  document.documentElement.style.width = document.body.style.width = W + 'px';
  document.documentElement.style.height = document.body.style.height = H + 'px';
</script>
</body>
</html>
